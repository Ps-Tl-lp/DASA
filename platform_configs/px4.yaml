# PX4 config for the HYDRA demo
#
# PX4's names and numbers live in this one file and appear nowhere else. The generator, the
# mission settings and the states stay platform-neutral. Another platform needs its own version
# of this file, plus its own plan writer and log reader if its plan or log format differs.
# Who uses each part:
#   vehicle_types, px4_setup   generator, harness   which drone flies, and how PX4 is set up
#   preconditions              generator            rules every generated mission must pass
#   tasks, plan_item_defaults  plan step            how a change in state becomes a .plan item
#   base_lat_lon               plan step, harness   where the base is on the map
#   readings                   log reader           what we read from the .ulg log
#   not_in_log, derived,       verifier             how the readings are judged against the mission
#   goal_check, postconditions
#   tolerances                 all of them          the shared numbers; each one says who uses it
# docs/px4-mappings.md has the reasoning and the PX4 doc links. docs/definitions.md has the terms.
# A `helper:` names a function for the builder to write. The comment above it says what it checks.
#
# PROPOSED values are not decided yet (see docs/testing.md, "Not decided yet"). PLACEHOLDER notes are still to do.
# Positions are metres from the base (0, 0, 0): x north, y east, z up. PX4 uses north, east,
# down, so we flip z (see flip_sign under readings). PX4 calls the base "home".

platform: px4
log_format: ulog # .ulg files. They also record the PX4 parameters the flight used.

# ---- Vehicle types --------------------------------------------------------------
# The drones we can launch and what each is fitted with. The generator picks a type, and the
# start state copies its equipment into agent.has_camera and agent.has_grippers. The harness
# launches sim_model, so the state always matches the drone that actually flies.
vehicle_types:
  multicopter:
    sim_model: gz_x500
    has_camera: false
    has_grippers: false
  # The camera drone, for take_picture. Its px4_setup is added to the block below for this type
  # only: TRIG_MODE 1 switches PX4's camera trigger on (it is off by default). It has to be set
  # when PX4 starts, not after. A plain multicopter flies with the trigger off.
  multicopter_camera:
    sim_model: gz_x500_mono_cam
    has_camera: true
    has_grippers: false
    px4_setup: { TRIG_MODE: 1 }

# ---- PX4 setup ------------------------------------------------------------------
# PX4 parameters the harness sets before every demo flight. They apply to the whole flight, not
# to one task. Anything not listed stays at PX4's default. A vehicle type can add its own
# (see multicopter_camera).
px4_setup:
  RTL_TYPE: 0          # return goes straight to the base (our plans have no rally points)
  RTL_LAND_DELAY: 0    # land on arrival instead of hovering
  RTL_RETURN_ALT: 30   # the climb before flying home. Already 30 in both logs; set here so
                       # the stays_in_geofence precondition has a value to read
  NAV_MC_ALT_RAD: 0.8  # how close in height counts as "at the waypoint" (= tolerances.at_waypoint.height_within_m)
  GF_MAX_HOR_DIST: 0   # PX4's geofence off. With it on, PX4 takes over when a variant drifts
  GF_MAX_VER_DIST: 0   # and hides the failure we want to see. The verifier checks the geofence instead.

# ---- Preconditions (generator) --------------------------------------------------
# A mission the drone can't complete tells us nothing about a variant, so the generator only
# outputs missions that pass every rule here. Three groups, plus a list of things we assume:
#   global   limits on single values. The generator draws inside them, so they need no check.
#   mission  how a mission's values fit together. Checked on each candidate. A check that
#            doesn't apply (the geofence check on a mission with no geofence) just passes.
#   tasks    whether the drone can do what the mission asks.
# Mission settings (simple, medium, survey) live with the generator. They can narrow these
# ranges but never widen them. A setting outside them is an error when it loads.
# Every mission starts with the agent at the base (0, 0, 0), landed and at rest.
preconditions:
  global:
    allowed_values:
      agent.vehicle_type: [multicopter, multicopter_camera]
      waypoint.z: { min: 5 } # PROPOSED. Twice PX4's takeoff height setting (MIS_TAKEOFF_ALT, 2.5 m). The lowest waypoint flown so far is 6 m.
    # How big the world is: a cylinder around the base. A mission's geofence (in its settings)
    # must fit inside it. A mission with no geofence can put its points anywhere in the flight area.
    flight_area:
      max_distance_m: 200 # PROPOSED. Our survey plan reaches 170 m.
      max_height_m: 50    # PROPOSED. Room for a geofence above the 30 m return climb, and for waypoints at 30 m.

  mission:
    # No two "at the waypoint" zones overlap, so a visit or hold at one can't count for another.
    # Two zones are apart when their centres are more than twice at_waypoint.within_m apart
    # sideways, or more than twice height_within_m apart in height. Every waypoint is also more
    # than twice within_m sideways from the base, whatever its height: takeoff and the return go
    # straight up and down over the base, through any zone above it.
    waypoint_spacing: { helper: zones_apart, zone: tolerances.at_waypoint }
    # The postcondition of the same name, checked before the flight on where the plan will fly:
    # every waypoint, and the height PX4 climbs to before flying home (return_height_m). Each has
    # to be inside the mission's geofence by clearance_m, because correct flights overshoot a
    # little. A mission with no geofence passes.
    stays_in_geofence: { helper: inside_geofence, return_height_m: px4_setup.RTL_RETURN_ALT, clearance_m: tolerances.geofence_clearance_m }

  tasks:
    # The plan step can build a plan: every change between start and goal has a task below whose
    # `needs` can be met. This is where equipment gets checked. take_picture needs
    # agent.has_camera: true, so a picture mission on a drone without a camera fails here.
    every_change_has_a_task: { helper: plan_exists }

  # Things we assume instead of checking. They depend on the running sim, not on the mission's
  # values, so the generator can't test them. The harness watches for them: if one fails (the
  # drone won't arm, or PX4 refuses to start the mission), the run is INCONCLUSIVE, so it doesn't
  # count as the variant failing. The harness passes that on with the run, so the verifier
  # doesn't judge the log as a normal flight.
  assumed: [can_arm, mission_starts]

# ---- Tasks (plan step) ----------------------------------------------------------
# A task is something we ask the drone to do, like "go to W1". How it actually flies there is
# PX4's job, so we don't model it.
#
# How the plan step picks tasks: compare the start state with the goal state.
#   - Every property that changed needs a task that sets it. `sets` is how the plan step finds it.
#   - A property that didn't change gets no task. If a waypoint's clicked_pic is false in both
#     states, there's no take_picture, even though the waypoint exists.
#   - `needs` adds whatever has to happen first (takeoff before goto), and the goal state's end
#     position adds return_home.
# docs/px4-mappings.md section 4 walks through the simple mission.
#
#   takes      what the plan step hands the task: a waypoint, a height, a hold
#   needs      what has to be true in the state before the task
#   sets       the change in state the task makes
#   plan_item  the .plan item it turns into (command and frame are MAVLink numbers)
#   relies_on  PX4 parameters we don't set that shape how the task flies
# In params, a $name is a value the plan step fills in: one from `takes`, or a latitude or
# longitude it works out (see the end of this section). A name without a $ means "use that
# value", like waypoint.z or tolerances.at_waypoint.within_m. `base` and `waypoint` are things
# in the mission's state. The base is the launch point, at (0, 0, 0).
# The plan step reads the mission's postconditions as well as its two states. The states can't
# show a hold or an order, so $hold_s and the order of the gotos come from the postconditions
# (hold_at, visits_in_order). With no order asked for, gotos go in waypoint id order.
# Takeoff climbs to the height of the first waypoint the plan flies to (PROPOSED). Our three
# plans already do this.
tasks:
  takeoff:
    takes: [height]
    needs: { agent.landed: true }
    sets:  { agent.z: $height, agent.landed: false }
    plan_item: { command: 22, frame: 3, params: [0, 0, 0, null, $home_lat, $home_lon, $height] }
  goto:
    # $hold_s is the hold the mission's postconditions ask for at this waypoint (0 if none).
    # Param 2 is how close PX4 has to get before it counts the waypoint reached and starts the
    # hold. Left at 0, PX4 uses 10 m, and the "hold" is mostly the drone slowing down on its way
    # in (docs/px4-mappings.md section 5).
    takes: [waypoint, hold_s]
    needs: { agent.landed: false }
    sets:  { agent.x: waypoint.x, agent.y: waypoint.y, agent.z: waypoint.z, waypoint.visited: true }
    plan_item: { command: 16, frame: 3, params: [$hold_s, tolerances.at_waypoint.within_m, 0, null, $wp_lat, $wp_lon, waypoint.z] }
  return_home:
    needs: { agent.landed: false }
    sets:  { agent.x: base.x, agent.y: base.y, agent.z: base.z, agent.landed: true }
    plan_item: { command: 20, frame: 2, params: [0, 0, 0, null, 0, 0, 0] }
  take_picture:
    # Flown in Gazebo in local spikes, each time at a waypoint with a 5 s hold. PX4 runs the item when
    # the waypoint's hold ends. Works only on a vehicle type that sets TRIG_MODE (multicopter_camera).
    takes: [waypoint]
    needs: { agent.landed: false, agent.has_camera: true, agent.x: waypoint.x, agent.y: waypoint.y, agent.z: waypoint.z }
    sets:  { waypoint.clicked_pic: true }
    plan_item: { command: 203, frame: 2, params: [0, 0, 0, 0, 1, 0, 0] } # param 5 = 1: one picture
    relies_on: [TRIG_INTERFACE] # 3 (MAVLink) in every SITL log so far; the docs list 4 as the general default

# Every item in the .plan file also gets these fields, with the same values each time, plus an
# Altitude equal to its height (0 for return_home, as in simple.plan) and a doJumpId: its place
# in the plan, counting from 1. The plan step adds them. The rest of the file, everything outside
# `items`, is as in missions/simple.plan.
plan_item_defaults: { type: SimpleItem, autoContinue: true, AltitudeMode: 1, AMSLAltAboveTerrain: null }

# $home_lat, $home_lon, $wp_lat, $wp_lon: the .plan file wants latitude and longitude, not metres.
# base_lat_lon is where the simulator starts the drone: quick-setup's default PX4_HOME_LAT and
# PX4_HOME_LON, and the home in our three plans. The log's home_position can confirm it.
# PLACEHOLDER: a helper that converts waypoint metres into latitude and longitude from the base.
base_lat_lon: { lat: 47.397971057728974, lon: 8.546163739800146 }

# ---- Readings (log reader) ------------------------------------------------------
# Everything we read from the log, each as timed values over the whole flight. This is all the
# log reader does: it turns the log into these readings and doesn't need the mission. The
# sections after this one work from the readings and never touch the log.
#   subtract_first  subtract the first logged value, so positions are measured from the base
#                   (where the drone sat before takeoff) instead of PX4's own origin
#   flip_sign       multiply by -1, because PX4's z points down and ours points up
readings:
  agent.x:          { topic: vehicle_local_position_groundtruth, field: x,  subtract_first: true }
  agent.y:          { topic: vehicle_local_position_groundtruth, field: y,  subtract_first: true }
  agent.z:          { topic: vehicle_local_position_groundtruth, field: z,  subtract_first: true, flip_sign: true }
  agent.velocity.x: { topic: vehicle_local_position_groundtruth, field: vx }
  agent.velocity.y: { topic: vehicle_local_position_groundtruth, field: vy }
  agent.velocity.z: { topic: vehicle_local_position_groundtruth, field: vz, flip_sign: true }
  agent.landed:     { topic: vehicle_land_detected, field: landed }
  disarm_reason:    { topic: vehicle_status, field: latest_disarming_reason } # not part of the state
  camera_triggered_at: { topic: camera_capture, field: timestamp } # not part of the state. One value each time PX4 triggers the camera. No trigger, no topic in the log

# ---- Checks (verifier) ----------------------------------------------------------
# The verifier gets the readings and the mission, and does all the judging.

# State properties that aren't read from the log.
not_in_log:
  agent.vehicle_type: start_state  # the start state's value stands
  agent.has_camera:   vehicle_type # from the vehicle type's entry above
  agent.has_grippers: vehicle_type

# State properties worked out from several readings, using the mission's waypoints.
derived:
  waypoint.visited:     { reads: [agent.x, agent.y, agent.z], rule: at the waypoint at any point in the flight }
  # The log shows that PX4 triggered the camera, not that an image exists. For now clicked_pic
  # means the trigger. A vehicle type with no camera flies with the trigger switched off, so
  # there it stays false.
  waypoint.clicked_pic: { reads: [camera_triggered_at, agent.x, agent.y, agent.z], rule: PX4 triggered the camera while the agent was at the waypoint }

# Goal check: compare each state property with the goal state. Positions match within
# at_goal.within_m (straight-line distance), speed over all three axes counts as at rest below
# at_goal.speed_below_m_s, and everything else must match exactly.
# A log that is cut off early is not handled yet (docs/testing.md, "Not decided yet").
goal_check:
  compares: last_reading   # of each property read from the log (not_in_log and derived give the rest).
                           # Each log holds one flight, so that's the end of the flight.
  position: tolerances.at_goal.within_m
  at_rest: tolerances.at_goal.speed_below_m_s

# How each postcondition is checked. Which ones a mission has, and their values (the geofence
# size, the hold at each waypoint, the order), come from the mission. The verifier checks against the
# mission's values, not against what the plan file asked PX4 for. Each gives PASS, FAIL, or
# INCONCLUSIVE when the log can't settle it.
postconditions:
  stays_in_geofence:
    reads: [agent.x, agent.y, agent.z]
    # The same helper as the precondition of this name, run on the flown path with no clearance.
    helper: inside_geofence
    rule: every reading inside the mission's geofence cylinder
  hold_at:
    reads: [agent.x, agent.y, agent.z]
    # One per waypoint the mission wants a hold at. A stretch at the waypoint runs from the first
    # reading inside the zone to the first reading outside it, and it keeps counting after PX4
    # starts the return (PROPOSED). PASS if one stretch is at least the mission's hold. FAIL if
    # none is. INCONCLUSIVE if the log stops while the drone is still there and the hold isn't
    # complete. What a gap in the log does to this is not part of the rule yet
    # (docs/px4-mappings.md section 5 has a proposal).
    rule: longest time at the waypoint >= required hold
  visits_in_order:
    reads: [agent.x, agent.y, agent.z]
    # The mission lists its waypoints in the order it wants. Find the first time the drone is at
    # the first one, then the first time after that at the second, and so on. PASS if every
    # waypoint gets a time. FAIL if one doesn't.
    rule: each waypoint is visited after the one before it
  disarmed_after_landing:
    reads: [disarm_reason]
    rule: last reading is 6 # 6 = PX4 disarmed itself after landing (7 in PX4 v1.13 to v1.16)

# ---- Tolerances -----------------------------------------------------------------
tolerances:
  # One definition of "at the waypoint", used by the plan, visited, clicked_pic, the hold and
  # the order. A short cylinder around the waypoint: within_m sideways, height_within_m up or
  # down. A position exactly on a limit counts as inside. The plan step writes within_m into
  # each goto; the height part has no slot in a plan item, so px4_setup sets it.
  at_waypoint:
    within_m: 2         # PROPOSED. Flown twice in Gazebo: a 5 s hold measured 6.05 s and 6.11 s in the zone.
    height_within_m: 0.8 # PROPOSED. PX4 gets the same number as NAV_MC_ALT_RAD in px4_setup.
  # How close the end of the flight has to be to the goal state.
  at_goal:
    within_m: 0.5         # PROPOSED. 28 local Gazebo flights ended within 0.09 m of the base. SIH lands less precisely.
    speed_below_m_s: 0.1  # PROPOSED. Every complete flight logged so far ended at 0.00 m/s.
  # How far inside the geofence the plan has to stay (the stays_in_geofence precondition). Only
  # the generator uses it. The verifier checks the flown path against the geofence itself.
  geofence_clearance_m: 2 # PROPOSED. The two logs peaked 0.05 m and 1.08 m above RTL_RETURN_ALT, and one drifted 0.98 m past W1.
