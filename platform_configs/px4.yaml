# PX4 config for the HYDRA demo
#
# PX4's names and numbers live in this one file and appear nowhere else. The generator, the
# mission settings and the states stay platform-neutral. Another platform needs its own version
# of this file, plus its own plan writer and log reader if its plan or log format differs.
# Who uses each part:
#   vehicle_types, px4_setup   generator, harness   which drone flies, and how PX4 is set up
#   preconditions              generator            rules every generated mission must pass
#   tasks, plan_item_defaults, plan step            how a change in state becomes a .plan item
#   plan_template, inputs
#   base_lat_lon               plan step, harness   where the base is on the map
#   readings, time_zero_topics log reader           what we read from the Gazebo recording and the .ulg log
#   log_only_readings,         log reader           a run with no recording, and the log checked
#   cross_check                                     against the recording
#   not_in_log, derived,       verifier             how the readings are judged against the mission
#   goal_check, postconditions
#   helpers                    whoever builds one   every function this file names, and who calls it
#   tolerances                 all of them          the shared numbers
#   sim                        harness, log reader  where Gazebo's pose is recorded
# docs/px4-mappings.md has the reasoning and the PX4 doc links. docs/definitions.md has the terms.
# platform_configs/README.md says what belongs in this file, in the mission, and in code.
#
# How values are written. The same rules hold in every section:
#   2, true, gz_x500    A plain value. Used as written.
#   tolerances.at_goal.within_m, px4_setup.RTL_RETURN_ALT, base_lat_lon.lat
#                       A name that starts with a section of this file. Use the value found there.
#   agent.x, waypoint.z, base.x
#                       A state property. Use the value from the mission's state.
#   $hold_s             A value a program fills in. `inputs` has one row per name saying where it comes from.
#   helper: NAME        A function a builder writes. `helpers` lists every one and who calls it.
#   rule: SENTENCE      One plain sentence saying what a check must do. No program runs it.
#   reads: [NAMES]      The readings a check uses. The names come from `readings`.
#   start_state, last_reading, exact
#                       A keyword. The comment next to it says what it means.
#
# PROPOSED values are not decided yet (see docs/testing.md, "Not decided yet"). PLACEHOLDER notes are still to do.
# Positions are metres from the base (0, 0, 0): x north, y east, z up. PX4 uses north, east,
# down, so a row reading the log flips z (flip_sign). Gazebo's recording is already z up. PX4
# calls the base "home".

platform: px4
log_format: ulog # .ulg files. They also record the PX4 parameters the flight used.

# ---- Vehicle types --------------------------------------------------------------
# The drones we can launch and what each is fitted with. The generator picks a type, and the
# start state copies its equipment into agent.has_camera and agent.has_grippers. The harness
# launches sim_model, so the state always matches the drone that actually flies.
vehicle_types:
  multicopter:
    sim_model: gz_x500
    has_camera: false
    has_grippers: false
  # Our name for PX4's gz_x500_mono_cam model flown with TRIG_MODE 1. The drone for take_picture.
  # TRIG_MODE 1 switches PX4's camera trigger on. PX4 has the trigger off by default, so a
  # plain multicopter flies with it off.
  # The harness adds this type's px4_setup to the block below, for this type only. TRIG_MODE
  # has to be set when PX4 starts, not after.
  multicopter_camera:
    sim_model: gz_x500_mono_cam
    has_camera: true
    has_grippers: false
    px4_setup: { TRIG_MODE: 1 }

# ---- PX4 setup ------------------------------------------------------------------
# PX4 parameters the harness sets before every demo flight. They apply to the whole flight, not
# to one task. Anything not listed stays at PX4's default. A vehicle type can add its own
# (see multicopter_camera).
# On the simulator build (fca3df865a) every value here is what PX4 already uses for a
# multicopter, so listing them changes nothing today: it pins them against a PX4 change and
# gives the preconditions a value to read. All but one are PX4's documented parameter
# defaults. RTL_RETURN_ALT is documented as 60 m, but PX4's multicopter startup script
# (rc.mc_defaults) sets 30 m. Of the settings in this file, only multicopter_camera's
# TRIG_MODE changes what PX4 does (NAV_MC_ALT_RAD would too, if
# at_waypoint.height_within_m moved off 0.8).
px4_setup:
  RTL_TYPE: 0          # documented default. Return goes straight to the base (our plans have no rally points)
  RTL_LAND_DELAY: 0    # documented default. Land on arrival instead of hovering
  RTL_RETURN_ALT: 30   # documented default 60; rc.mc_defaults sets 30 for multicopters. The climb
                       # before flying home; set here so stays_in_geofence has a value to read
  # How close in height counts as "at the waypoint". The harness follows the name to the number.
  NAV_MC_ALT_RAD: tolerances.at_waypoint.height_within_m
  GF_MAX_HOR_DIST: 0   # documented default: PX4's geofence off. With it on, PX4 takes over when a variant
  GF_MAX_VER_DIST: 0   # drifts and hides the failure we want to see. The verifier checks the geofence instead.

# ---- Preconditions (generator) --------------------------------------------------
# A mission the drone can't complete tells us nothing about a variant, so the generator only
# outputs missions that pass every rule here. Three groups, plus a list of things we assume:
#   global   limits on single values. The generator draws inside them, so they need no check.
#   mission  how a mission's values fit together. Checked on each drawn mission. A check
#            that doesn't apply (the geofence check on a mission with no geofence) just passes.
#   tasks    whether the drone can do what the mission asks.
# Mission settings (simple, medium, survey) live with the generator. They can narrow these
# ranges but never widen them. A setting outside them is an error when it loads.
# Every mission starts with the agent at the base (0, 0, 0), landed and at rest.
preconditions:
  global:
    allowed_values:
      agent.vehicle_type: [multicopter, multicopter_camera]
      waypoint.z: { min: 5 } # PROPOSED. The lowest height we test. The lowest waypoint flown so far is 6 m.
    # How far out the generator is allowed to place a mission. Our own limit; PX4 and Gazebo
    # don't set one. It is a cylinder around the base.
    # A mission's geofence (in its settings) must fit inside it.
    # A mission with no geofence can put its points anywhere in it.
    flight_area:
      max_distance_m: 200 # PROPOSED. Our survey plan reaches 170 m.
      max_height_m: 50    # PROPOSED. Room for a geofence above the 30 m return climb, and for waypoints at 30 m.

  mission:
    # A visit or hold at one waypoint must not count for another.
    # Two zones are apart when their centres are more than twice within_m apart sideways, or
    # more than twice height_within_m apart in height.
    # Every waypoint is also more than twice within_m sideways from the base, whatever its
    # height. Takeoff and the return go straight up and down over the base, through any zone
    # above it.
    waypoint_spacing:
      helper: zones_apart
      zone: tolerances.at_waypoint
      rule: no two waypoint zones overlap, and every waypoint is clear of the base
    # The same geofence as the postcondition of this name, checked before the flight.
    # It checks every waypoint, plus the height PX4 climbs to before flying home (return_height_m).
    # clearance_m is the margin, because correct flights overshoot a little.
    # A mission with no geofence passes.
    stays_in_geofence:
      helper: inside_geofence
      return_height_m: px4_setup.RTL_RETURN_ALT
      clearance_m: tolerances.geofence_clearance_m
      rule: every waypoint and the return climb are inside the mission's geofence by clearance_m

  tasks:
    # plan_exists is the plan step itself: it builds the task list for the drawn mission, then
    # checks it against the tasks' needs and sets (see Tasks). The generator keeps only a
    # mission that passes, and that plan is the one that gets flown. Equipment is checked like
    # any other need: a picture on a drone without a camera fails at take_picture's
    # agent.has_camera.
    every_change_has_a_task:
      helper: plan_exists
      rule: the plan step's task list, walked from the start state, meets every task's needs and ends in the goal state

  # Things we assume instead of checking. They depend on the running sim, not on the mission's
  # values, so the generator can't test them. The harness watches for them: if one fails (the
  # drone won't arm, or PX4 refuses to start the mission), the run is INCONCLUSIVE, so it doesn't
  # count as the variant failing. The harness passes that on with the run, so the verifier
  # doesn't judge the log as a normal flight.
  assumed: [can_arm, mission_starts]

# ---- Tasks (plan step) ----------------------------------------------------------
# A task is something we ask the drone to do, like "go to W1". We only say what each task
# changes, not the path PX4 takes to do it.
#
# How the plan step builds a plan, in a fixed order: takeoff; a goto for each waypoint whose
# visited or clicked_pic changes, in visits_in_order order (else waypoint id order);
# take_picture straight after its waypoint's goto; return_home. A property that didn't change
# gets no task: if a waypoint's clicked_pic is false in both states, there's no take_picture,
# even though the waypoint exists. If no property changes, the plan has no items at all, not
# even a takeoff.
# Then it checks the list. Start from the start state; for each task in turn, its needs must
# hold, then its sets apply. The result must equal the goal state on every property the goal
# lists. Positions compare exactly: they are the mission's numbers, not flown ones. Any failure
# means no plan, and the reason names the task and the property. The states can't show order or
# time, so the check can't either: the order comes from the fixed order above, and the verifier
# checks order and holds after the flight.
# docs/px4-mappings.md section 4 walks through the simple mission.
#
#   needs      what has to be true in the state before the task
#   sets       the change in state the task makes. A $ value here is filled from `inputs`, as
#              in plan_item: takeoff's $height is the first goto's height
#   plan_item  the .plan item it turns into (command and frame are MAVLink numbers). null is how
#              a .plan file writes NaN: for param 4 (yaw), PX4 keeps its current heading mode
#   relies_on  PX4 parameters we don't set that shape how the task flies
# In needs and sets, a value that starts with agent., waypoint. or base. is that property's
# value in the running state, and anything else is a plain value. A waypoint that doesn't list
# clicked_pic counts as false.
# `base` and `waypoint` are things in the mission's state. The base is the launch point, at (0, 0, 0).
# The two states can't show a hold or an order, so the plan step also reads the mission's
# postconditions. The order of the gotos comes from visits_in_order. With no order asked for,
# gotos go in waypoint id order.
# Every $ value in a plan_item is listed in `inputs`, after this section.
tasks:
  takeoff:
    needs: { agent.landed: true, agent.x: base.x, agent.y: base.y } # the item takes off at base_lat_lon
    sets:  { agent.z: $height, agent.landed: false }
    plan_item: { command: 22, frame: 3, params: [0, 0, 0, null, base_lat_lon.lat, base_lat_lon.lon, $height] }
  goto:
    # Param 2 is how close PX4 has to get before it counts the waypoint reached and starts the
    # hold. Left at 0, PX4 uses 10 m, and the "hold" is mostly the drone slowing down on its way
    # in (docs/px4-mappings.md section 5).
    needs: { agent.landed: false }
    sets:  { agent.x: waypoint.x, agent.y: waypoint.y, agent.z: waypoint.z, waypoint.visited: true }
    plan_item: { command: 16, frame: 3, params: [$hold_s, tolerances.at_waypoint.within_m, 0, null, $wp_lat, $wp_lon, waypoint.z] }
  return_home:
    needs: { agent.landed: false }
    sets:  { agent.x: base.x, agent.y: base.y, agent.z: base.z, agent.landed: true, agent.velocity.x: 0, agent.velocity.y: 0, agent.velocity.z: 0 } # landed and at rest
    plan_item: { command: 20, frame: 2, params: [0, 0, 0, null, 0, 0, 0] }
  take_picture:
    # Flown in Gazebo in local spikes, each time at a waypoint with a 5 s hold. PX4 runs the item when
    # the waypoint's hold ends. Works only on a vehicle type that sets TRIG_MODE (multicopter_camera).
    needs: { agent.landed: false, agent.has_camera: true, agent.x: waypoint.x, agent.y: waypoint.y, agent.z: waypoint.z }
    sets:  { waypoint.clicked_pic: true }
    plan_item: { command: 203, frame: 2, params: [0, 0, 0, 0, 1, 0, 0] } # param 5 = 1: one picture
    relies_on: [TRIG_INTERFACE] # 3 (MAVLink) in every SITL log so far; the docs list 4 as the general default

# Every item in the .plan file also gets these fields. The first four are the same on every
# item. doJumpId and Altitude differ from item to item, so they are $ values.
plan_item_defaults: { type: SimpleItem, autoContinue: true, AltitudeMode: 1, AMSLAltAboveTerrain: null, doJumpId: $index, Altitude: $item_height }

# Everything in the .plan file outside `items` is copied from this plan. The path is from the repo root.
plan_template: missions/simple.plan

# Where the simulator starts the drone, as latitude and longitude. It is quick-setup's default
# PX4_HOME_LAT and PX4_HOME_LON, and the home in our three plans.
# Takeoff writes it into the plan. The log's home_position can confirm it.
# alt is the base's height above sea level, in metres, for the simulator. If any of PX4_HOME_LAT,
# PX4_HOME_LON and PX4_HOME_ALT is set, PX4 needs all three (px4-rc.gzsim). 0 is the elevation of
# Gazebo's default world and the plannedHomePosition height in simple.plan and survey.plan
# (medium.plan has 491).
base_lat_lon: { lat: 47.397971057728974, lon: 8.546163739800146, alt: 0 }

# ---- Inputs (plan step) ---------------------------------------------------------
# Where each $ value comes from. One row per name. `from` is one of:
#   postcondition  the mission's postcondition called `name`, for this waypoint: its `field`.
#                  `default` if the mission has none.
#   first_goto     the first goto in the plan
#   waypoint       this waypoint's position, put through the helper. `output` names which of
#                  the helper's results (`returns` in `helpers`) this value is.
#   item           the plan item being written
inputs:
  $height:      { from: first_goto, value: waypoint.z } # PROPOSED. Takeoff climbs to the first waypoint's height. Our three plans already do this.
  $hold_s:      { from: postcondition, name: hold_at, field: min_s, default: 0 }
  $wp_lat:      { from: waypoint, helper: metres_to_lat_lon, output: lat } # the .plan file wants latitude and longitude, not metres
  $wp_lon:      { from: waypoint, helper: metres_to_lat_lon, output: lon }
  $index:       { from: item, value: position_in_plan } # 1 for the first item, 2 for the second
  $item_height: { from: item, value: param_7 } # the item's height: the last of its seven params. 0 for return_home, as in simple.plan

# ---- Readings (log reader) ------------------------------------------------------
# Everything we read about the flight, each as timed values over the whole flight. This is all
# the log reader does: it turns the harness's Gazebo recording and the log into these readings
# and doesn't need the mission. The sections after this one work from the readings and never
# touch either file.
# Every row names its source:
#   gz_pose  the harness's recording of Gazebo's pose topic (sim.pose_topic), made outside PX4.
#            field is north, east or up in Gazebo's world frame.
#   log      PX4's .ulg: topic and field.
# Position, velocity and landed come from the recording, so a PX4 that changes its log can't
# change them. There is one position reading per recorded sample. The flight mode, the disarm
# reason and the camera trigger are PX4's own reports.
#   rate_of         names another reading. The velocity at a reading is the change in that
#                   reading since the one before it, divided by the time between them; the
#                   first reading's velocity is 0.
#   on_ground_m, still_below_m_s
#                   landed at a reading: no higher than on_ground_m above where the drone
#                   started, and its speed (from the three rate_of readings) below still_below_m_s
#   subtract_first  subtract the first value, so positions are measured from the base
#                   (where the drone sat before takeoff) instead of the simulator's origin
#   flip_sign       multiply by -1, because PX4's z points down and ours points up (log rows only)
# The recording (run.json `recording`) is JSON lines written by the harness. A pose line is
# {"k": "pose", "t": sim seconds, "p": [east, north, up]} for the vehicle: the first model on
# sim.pose_topic whose name starts with sim.vehicle_model_prefix. A {"k": "pubs"} line lists the
# topic's publishers. In SITL lockstep PX4's clock is the sim clock, so t * 1e6 is a log
# timestamp, with no offset (2026-11-23 spike).
# Times are seconds from the earliest sample of time_zero_topics in the log, a missing topic
# left out. The readings cover the log's own span (its first to last ground-truth sample), so a
# log cut short gives readings cut short.
readings:
  agent.x:          { source: gz_pose, field: north, subtract_first: true }
  agent.y:          { source: gz_pose, field: east,  subtract_first: true }
  agent.z:          { source: gz_pose, field: up,    subtract_first: true }
  agent.velocity.x: { source: gz_pose, rate_of: agent.x }
  agent.velocity.y: { source: gz_pose, rate_of: agent.y }
  agent.velocity.z: { source: gz_pose, rate_of: agent.z }
  agent.landed:     { source: gz_pose, on_ground_m: tolerances.landed.height_m, still_below_m_s: tolerances.landed.speed_m_s }
  nav_state:        { source: log, topic: vehicle_status, field: nav_state } # not part of the state. PX4's flight mode, logged on every change
  disarm_reason:    { source: log, topic: vehicle_status, field: latest_disarming_reason } # not part of the state
  camera_triggered_at: { source: log, topic: camera_capture, field: timestamp } # not part of the state. One value each time PX4 triggers the camera. No trigger, no topic in the log
time_zero_topics: [vehicle_local_position_groundtruth, vehicle_land_detected]

# A run flown before the harness recorded Gazebo (the M01 fixture's R02, for one) is read from
# the log alone, with these rows in place of the ones above, and its readings say so.
log_only_readings:
  agent.x:          { source: log, topic: vehicle_local_position_groundtruth, field: x,  subtract_first: true }
  agent.y:          { source: log, topic: vehicle_local_position_groundtruth, field: y,  subtract_first: true }
  agent.z:          { source: log, topic: vehicle_local_position_groundtruth, field: z,  subtract_first: true, flip_sign: true }
  agent.velocity.x: { source: log, topic: vehicle_local_position_groundtruth, field: vx }
  agent.velocity.y: { source: log, topic: vehicle_local_position_groundtruth, field: vy }
  agent.velocity.z: { source: log, topic: vehicle_local_position_groundtruth, field: vz, flip_sign: true }
  agent.landed:     { source: log, topic: vehicle_land_detected, field: landed }
  nav_state:        { source: log, topic: vehicle_status, field: nav_state }
  disarm_reason:    { source: log, topic: vehicle_status, field: latest_disarming_reason }
  camera_triggered_at: { source: log, topic: camera_capture, field: timestamp }

# The log's own ground truth, checked against the recording. PX4's gz_bridge reads the same
# Gazebo topic, so in a correct run every log sample has a recorded sample at the same sim time
# with the same position (a Gazebo spike on 2026-11-23: 1403 of 1403 samples, within 2.1 um;
# 5 flights with a full recording, within 5.3 um). Positions are compared in the world frame,
# before subtract_first; down is the log's z, compared with the recording's up flipped.
# A run with no recording has no cross-check: it is read from the log alone and judged on it.
# A run whose log and recording disagree is INCONCLUSIVE, whatever the other checks say, and the
# disagreement is reported as its own check (evidence_cross_check): a log that doesn't match the
# simulator is invalid evidence, and a variant that edits its own log is a finding in itself.
cross_check:
  log: { topic: vehicle_local_position_groundtruth, north: x, east: y, down: z }
  same_time_within_s: tolerances.cross_check_time_s
  max_difference_m: tolerances.cross_check_m
  rule: every log sample has a recorded sample at the same time, no more than max_difference_m away, and the pose topic has one publisher

# ---- Checks (verifier) ----------------------------------------------------------
# The verifier gets the readings and the mission, and does all the judging.

# State properties that aren't read from the log.
# The positions of the base and the waypoints are part of the mission and never change, so they
# are not listed.
not_in_log:
  agent.vehicle_type: start_state  # the start state's value stands
  agent.has_camera:   vehicle_type # from the vehicle type's entry above
  agent.has_grippers: vehicle_type

# State properties worked out from several readings, using the mission's waypoints.
derived:
  waypoint.visited:
    reads: [agent.x, agent.y, agent.z]
    helper: at_waypoint
    rule: at the waypoint at any point in the flight
  # The log shows that PX4 triggered the camera, not that an image exists. For now clicked_pic
  # means the trigger. A vehicle type with no camera flies with the trigger switched off, so
  # there it stays false.
  waypoint.clicked_pic:
    reads: [camera_triggered_at, agent.x, agent.y, agent.z]
    helper: at_waypoint
    rule: PX4 triggered the camera while the agent was at the waypoint

# Goal check: does the end of the flight match the goal state? Three ways of comparing:
#   position         one straight-line distance from the goal's position, within max_distance
#   speed            one overall speed across all three directions, below max_speed
#   everything else  must equal the goal's value
# Each log holds one flight, so the last reading is the end of the flight.
# not_in_log and derived give the properties that aren't readings.
# A property the goal state doesn't list is not compared.
# A log that is cut off before the disarm: disarmed_after_landing makes the run INCONCLUSIVE.
goal_check:
  use: last_reading
  within:
    - { reads: [agent.x, agent.y, agent.z], max_distance: tolerances.at_goal.within_m }
    - { reads: [agent.velocity.x, agent.velocity.y, agent.velocity.z], max_speed: tolerances.at_goal.speed_below_m_s }
  everything_else: exact

# How each postcondition is checked. Which ones a mission has, and their values (the geofence
# size, the hold at each waypoint, the order), come from the mission. The verifier checks against the
# mission's values, not against what the plan file asked PX4 for. Each gives PASS, FAIL, or
# INCONCLUSIVE when the log can't settle it.
# Each entry's `mission.yaml:` comment is how a mission asks for it, as one item of its
# postconditions list. PROPOSED, apart from hold_at, which is the M01 fixture's form. A check
# with every_mission: true runs on every mission, listed or not.
postconditions:
  # The same helper as the precondition of this name, run on the flown path with no clearance.
  # mission.yaml: - stays_in_geofence: {max_distance_m: 60, max_height_m: 35} (from the base)
  stays_in_geofence:
    reads: [agent.x, agent.y, agent.z]
    helper: inside_geofence
    rule: every reading inside the mission's geofence cylinder
  # One per waypoint the mission wants a hold at. Time counts only while PX4 is flying the
  # mission, so the time it takes to leave the zone after switching to the return doesn't.
  # Stretches are made of position readings. One starts at the first position reading inside
  # the zone while PX4 is in mission mode, and ends at the first later position reading that is
  # outside the zone or not in mission mode; its length is the time between those two readings.
  # PX4's mode at a reading is the last nav_state at or before it (mission mode if none yet).
  # PASS if one stretch lasts at least the mission's hold minus short_by_at_most. FAIL if none does.
  # INCONCLUSIVE if the log stops while the drone is still there and the hold isn't complete.
  # What a gap in the log does to this is not part of the rule yet (docs/px4-mappings.md
  # section 5 has a proposal).
  # mission.yaml: - hold_at: {waypoint: W1, min_s: 5}
  hold_at:
    reads: [agent.x, agent.y, agent.z, nav_state]
    helper: at_waypoint
    in_nav_state: 3 # NAVIGATION_STATE_AUTO_MISSION (msg/versioned/VehicleStatus.msg)
    short_by_at_most: tolerances.hold_short_by_s
    rule: the longest stretch of readings inside the zone while PX4 is in mission mode lasts at least the mission's hold minus short_by_at_most
  # The mission lists its waypoints in the order it wants. Find the first time the drone is at
  # the first one, then the first time after that at the second, and so on. PASS if every
  # waypoint gets a time. FAIL if one doesn't.
  # mission.yaml: - visits_in_order: {waypoints: [W1, W2]}
  visits_in_order:
    reads: [agent.x, agent.y, agent.z]
    helper: at_waypoint
    rule: each waypoint is visited after the one before it
  # What makes a log a complete flight: PX4 disarms itself after the landing. It is what makes
  # a log that stops after touchdown but before the disarm INCONCLUSIVE (R5), so every mission
  # gets it. Touchdown is the first landed reading after the last airborne one.
  #   PASS          the rule holds
  #   FAIL          the disarm reason changes between takeoff and touchdown (a disarm in the air)
  #   INCONCLUSIVE  no change at or after touchdown (the log stops first), or the log shows no
  #                 takeoff and touchdown (the other checks report that flight)
  # Takeoff is the first airborne reading in the log. In 28 Gazebo flights the reason changed
  # from 0 to 6 2.96-3.12 s after touchdown (2.008-2.016 s after PX4's own land detector said
  # landed, which is COM_DISARM_LAND).
  # mission.yaml: not listed (every mission gets it)
  disarmed_after_landing:
    every_mission: true
    reads: [disarm_reason, agent.landed]
    last_value: 6 # PX4 disarmed itself after landing (7 in PX4 v1.13 to v1.16)
    relies_on: [COM_DISARM_LAND] # PX4 disarms this long after landing (2 s default); at <= 0 it never does
    rule: the disarm reason changes to last_value at or after touchdown, and to nothing else after takeoff

# ---- Helpers --------------------------------------------------------------------
# Every function this file names. None is written yet.
# A function with more than one caller is written once and imported by both, so the two can't
# disagree at an edge. Where that shared code lives is not decided (docs/testing.md, "Not decided yet").
helpers:
  zones_apart:       { used_by: [generator], answers: are the waypoint zones clear of each other and of the base }
  at_waypoint:       { used_by: [verifier], zone: tolerances.at_waypoint, answers: is this position inside this waypoint's zone }
  inside_geofence:   { used_by: [generator, verifier], answers: is this position inside the mission's geofence }
  plan_exists:       { used_by: [generator], answers: can the plan step build a plan for this mission } # the plan step itself
  # Flat earth on PX4's sphere (R = 6371000 m, src/lib/geo/geo.h):
  #   lat = base lat + degrees(north / R),  lon = base lon + degrees(east / (R cos(base lat)))
  # It gives missions/simple.plan's W1 (50 m north) to the last digit. PX4's own
  # MapProjection::reproject agrees to a few millimetres within the flight area.
  metres_to_lat_lon: { used_by: [plan_step], returns: [lat, lon], answers: what latitude and longitude is this position } # PLACEHOLDER: not written

# ---- Tolerances -----------------------------------------------------------------
tolerances:
  # "At the waypoint" means inside a short cylinder around it: within_m sideways,
  # height_within_m above or below.
  # Every check built on the at_waypoint helper uses this one definition. So does waypoint_spacing.
  # PX4 gets the same zone in two places. within_m is written into each goto. A plan item has
  # no field for the height, so px4_setup points at height_within_m.
  at_waypoint:
    within_m: 2         # PROPOSED. Flown twice in Gazebo: a 5 s hold measured 6.05 s and 6.11 s in the zone.
    height_within_m: 0.8 # PROPOSED. px4_setup.NAV_MC_ALT_RAD points here.
    edge_counts_as_inside: true # a position exactly on a limit is inside
  # How close the end of the flight has to be to the goal state.
  at_goal:
    within_m: 0.5         # PROPOSED. 28 local Gazebo flights ended within 0.09 m of the base. SIH lands less precisely.
    speed_below_m_s: 0.1  # PROPOSED. Every complete flight logged so far ended at 0.00 m/s.
  # How far inside the geofence the plan has to stay (the stays_in_geofence precondition). Only
  # the generator uses it. The verifier checks the flown path against the geofence itself.
  geofence_clearance_m: 2 # PROPOSED. The two logs peaked 0.05 m and 1.08 m above RTL_RETURN_ALT, and one drifted 0.98 m past W1.
  # How much shorter than the mission's hold a stretch may be (hold_at). 28 Gazebo flights at 4x
  # (16 on fca3df865a, 12 on 6d1773f4c1): time in the zone and in mission mode was the planned
  # hold -0.05 to +0.24 s. 0.25 s covers the worst short reading (0.044 s) with room for one
  # dropped log sample at 4x (0.136 s). Numbers: e2e-prototype reviews/2026-11-23/evidence.py.
  hold_short_by_s: 0.25
  # Landed, worked out from the recorded position (readings.agent.landed). 28 Gazebo flights at
  # 4x (16 on fca3df865a, 12 on 6d1773f4c1): while PX4 said landed, the drone was within 0.001 m
  # of its start height and moved no faster than 0.001 m/s. With these values touchdown comes
  # 0.95-1.10 s before PX4's land detector says landed, and PX4 disarms 2.96-3.12 s after
  # touchdown.
  landed:
    height_m: 0.1
    speed_m_s: 0.1
  # How far the log's ground truth may be from the recording (cross_check). PX4 logs it as
  # float32, which rounded it by up to 5.3 um in 5 flights with a full recording (6d1773f4c1).
  cross_check_m: 0.0001
  # How close in sim time a recorded sample must be to a log sample to count as the same one.
  # Both sit on Gazebo's 4 ms physics step; in 5 flights every log sample had a recorded one at
  # the same stamp.
  cross_check_time_s: 0.0005

# ---- Simulator (harness) --------------------------------------------------------
# Where the harness records Gazebo's pose (readings, source gz_pose).
sim:
  world: default
  pose_topic: /world/default/pose/info # the topic PX4's gz_bridge turns into the log's ground truth
  vehicle_model_prefix: x500 # every vehicle type's sim_model is an x500
