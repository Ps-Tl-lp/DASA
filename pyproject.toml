# Tool settings only. This repo is not an installable package.

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The pipeline's packages sit at the repo root; let tests import them.
pythonpath = ["."]
addopts = "-ra --strict-markers"
